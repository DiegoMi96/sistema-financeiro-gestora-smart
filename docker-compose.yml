version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       gestora_smart
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestora2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ── Backend FastAPI ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://postgres:${DB_PASSWORD:-gestora2024}@db:5432/gestora_smart
      SECRET_KEY:      ${SECRET_KEY:-TROQUE-EM-PRODUCAO-USE-OPENSSL-RAND-HEX-32}
      ASAAS_API_KEY:   ${ASAAS_API_KEY:-}
      FRONTEND_URL:    ${FRONTEND_URL:-http://localhost:3000}
      DEBUG:           ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ── Frontend React ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      # 4000, não 3000: porta 3000 do host já é usada por outro processo
      # (dashboard legado /var/www/gestora-smart/server.js). O nginx de
      # produção já aponta para 4000 — corrigido aqui em 31/07/2026 porque o
      # arquivo real no servidor estava com "4000:80" (editado direto, nunca
      # sincronizado com o git) enquanto este arquivo dizia "3000:80". Um
      # `git pull` no servidor teria revertido para 3000 e derrubado o site.
      - "4000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ── Guardião (Next.js) — integrado 31/07/2026 ───────────────
  # Sistema do Thalles (controle de consumo de franquias). Roda em
  # /guardiao no mesmo domínio do sistema principal (ver guardiao/next.config.js
  # basePath). Login unificado: reusa a MESMA SECRET_KEY do backend (nunca
  # duplicar o valor à mão — sempre referenciar ${SECRET_KEY}).
  guardiao:
    build:
      context: ./guardiao
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GESTORA_JWT_SECRET: ${SECRET_KEY:-TROQUE-EM-PRODUCAO-USE-OPENSSL-RAND-HEX-32}
      # Nomes passados sem tradução (mesmo nome no .env do host e dentro do
      # container) — padronizado com prefixo GUARDIAO_ dos dois lados para
      # evitar o código lendo um nome e o compose só exportando outro.
      GUARDIAO_DATABASE_URL:       ${GUARDIAO_DATABASE_URL:-}
      # Opcionais — funcionalidades específicas falham graciosamente sem eles
      # (não impedem o resto do sistema de funcionar):
      GUARDIAO_CRON_SECRET:        ${GUARDIAO_CRON_SECRET:-}
      GUARDIAO_BREVO_API_KEY:      ${GUARDIAO_BREVO_API_KEY:-}
      GUARDIAO_SMSMARKET_USER:     ${GUARDIAO_SMSMARKET_USER:-}
      GUARDIAO_SMSMARKET_PASSWORD: ${GUARDIAO_SMSMARKET_PASSWORD:-}
    ports:
      - "3002:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
  uploads_data:

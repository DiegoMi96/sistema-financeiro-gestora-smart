<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{{TITLE}} | Gestora SMART</title>
<!--[if mso]><style>table,td,p,a,span{font-family:Arial,Helvetica,sans-serif !important;}</style><![endif]-->
<style>
  @media only screen and (max-width:620px){
    .container{width:100% !important;}
    .px{padding-left:24px !important;padding-right:24px !important;}
    .col{display:block !important;width:auto !important;padding:4px 0 !important;}
    .col-gap{display:block !important;width:auto !important;height:1px !important;margin:12px 0 !important;}
    .cards{padding-left:16px !important;padding-right:16px !important;}
    .fdiv{display:none !important;}
    .fcol{display:block !important;width:auto !important;padding-bottom:18px !important;}
    .fright{text-align:left !important;}
    .fpx{padding-left:24px !important;padding-right:24px !important;}
    .h1{font-size:24px !important;line-height:29px !important;}
    .hide-m{display:none !important;}
    .hdr-txt{padding:28px 24px !important;}
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#eef2f0;">

<!-- Pré-cabeçalho (aparece na prévia da caixa de entrada) -->
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#eef2f0;">
  {{PREHEADER}}
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef2f0;">
<tr><td align="center" style="padding:24px 12px;">

  <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;">

    <!-- Logo -->
    <tr>
      <td align="center" style="padding:32px 40px 24px 40px;">
        <img src="cid:logo-topo" width="220" alt="Gestora SMART" style="display:block;width:220px;max-width:220px;height:auto;border:0;outline:none;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:bold;color:#111827;">
      </td>
    </tr>

    <!-- Cabeçalho -->
    <tr>
      <td style="padding:0;background-color:#f7f9fa;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td class="hdr-txt" valign="middle" style="padding:30px 0 30px 44px;font-family:Arial,Helvetica,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="32" style="width:32px;height:3px;line-height:3px;font-size:0;background-color:#3cc46a;">&nbsp;</td></tr></table>
              <p class="h1" style="margin:16px 0 0 0;font-size:27px;line-height:32px;font-weight:bold;color:#111827;letter-spacing:-0.3px;">{{H1A}}</p>
              <p class="h1" style="margin:0;font-size:27px;line-height:32px;font-weight:bold;color:#22a447;letter-spacing:-0.3px;">{{H1B}}</p>
            </td>
            <td class="hide-m" width="220" valign="top" style="width:220px;padding:0;font-size:0;line-height:0;">
              <img src="cid:cabecalho-decoracao" width="220" height="196" alt="" style="display:block;width:220px;height:196px;border:0;">
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Corpo -->
    <tr>
      <td class="px" style="padding:32px 48px 0 48px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#374151;">
{{CORPO}}
      </td>
    </tr>

    {{SECAO}}

    <!-- Contato -->
    <tr>
      <td class="px" style="padding:36px 48px 44px 48px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#374151;">
        <p style="margin:0 0 6px 0;font-size:18px;line-height:24px;font-weight:bold;color:#111827;">{{DUVIDA_TITULO}}</p>
        <p style="margin:0 0 6px 0;">{{DUVIDA_TEXTO}}</p>
        <p style="margin:0;">
          <a href="mailto:{{CONTATO_EMAIL}}" style="color:#1a8a3c;font-weight:bold;text-decoration:none;">{{CONTATO_EMAIL}}</a>
          &nbsp;|&nbsp; <span style="color:#111827;font-weight:bold;">{{CONTATO_FONE}}</span>
        </p>
      </td>
    </tr>

    <!-- Rodapé -->
    <tr>
      <td style="background-color:#080d10;background-image:linear-gradient(90deg,#0f2418 0%,#080d10 38%);padding:0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td class="fpx" style="padding:38px 32px 26px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="fcol" width="140" valign="middle" style="width:140px;">
                    <img src="cid:logo-rodape-branco" width="140" alt="Gestora SMART" style="display:block;width:140px;height:auto;border:0;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;color:#ffffff;">
                  </td>
                  <td class="fdiv" width="20" style="width:20px;font-size:0;line-height:0;">&nbsp;</td>
                  <td class="fdiv" width="1" style="width:1px;background-color:#2a3138;font-size:0;line-height:0;">&nbsp;</td>
                  <td class="fdiv" width="18" style="width:18px;font-size:0;line-height:0;">&nbsp;</td>
                  <td class="fcol" width="130" valign="top" style="width:130px;font-family:Arial,Helvetica,sans-serif;">
                    <p style="margin:0 0 12px 0;font-size:12px;line-height:17px;color:#c4cad1;">{{REDES_TEXTO}}</p>
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
                      {{TD_REDES}}
                    </tr></table>
                  </td>
                  <td class="fdiv" width="18" style="width:18px;font-size:0;line-height:0;">&nbsp;</td>
                  <td class="fdiv" width="1" style="width:1px;background-color:#2a3138;font-size:0;line-height:0;">&nbsp;</td>
                  <td class="fdiv" width="20" style="width:20px;font-size:0;line-height:0;">&nbsp;</td>
                  <td class="fcol" valign="top" style="font-family:Arial,Helvetica,sans-serif;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td valign="top" width="20" style="width:20px;padding:2px 0 0 0;"><img src="cid:icone-email" width="13" alt="" style="display:block;width:13px;height:auto;border:0;"></td>
                        <td valign="top" style="padding:0 0 14px 0;font-size:12px;line-height:17px;"><a href="mailto:{{RODAPE_EMAIL}}" style="color:#e6e9ed;text-decoration:none;">{{RODAPE_EMAIL}}</a></td>
                      </tr>
                      <tr>
                        <td valign="top" width="20" style="width:20px;padding:2px 0 0 0;"><img src="cid:icone-local" width="12" alt="" style="display:block;width:12px;height:auto;border:0;"></td>
                        <td valign="top" style="font-size:12px;line-height:17px;"><a href="{{MAPS_URL}}" target="_blank" style="color:#3d7be0;text-decoration:underline;">{{ENDERECO}}</a></td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="height:1px;line-height:1px;font-size:0;background-color:#3d8a55;background-image:linear-gradient(90deg,#0d2a1a,#6fd08a 50%,#0d2a1a);">&nbsp;</td>
          </tr>
          <tr>
            <td class="fpx" style="background-color:#05090b;padding:18px 32px 20px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="fcol" valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:17px;color:#9aa3ad;">
                    {{COPYRIGHT}}<br>
                    <a href="mailto:{{RODAPE_EMAIL}}?subject=Descadastrar" style="color:#9aa3ad;text-decoration:underline;">{{DESCADASTRO_TEXTO}}</a>
                  </td>
                  <td class="fcol fright" align="right" valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:9px;line-height:14px;letter-spacing:2px;color:#8b949e;white-space:nowrap;">
                    {{SLOGAN}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>

  </table>

</td></tr>
</table>
</body>
</html>

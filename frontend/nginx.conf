server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — reduz em ~70% o tamanho de JSON, JS e CSS transferidos
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        application/json
        application/javascript
        text/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # index.html nunca cacheado — garante que o browser sempre busca a versão atual
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Assets com hash no nome (JS/CSS do Vite) podem ser cacheados por 1 ano
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens e fontes: cache moderado
    location ~* \.(png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy para chamadas de API feitas com URL relativa (/api/...)
    # ^~ impede que a regex de imagens *.png/*.jpg intercepte /api/organograma/photos/*
    location ^~ /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 64M;
    }

    # SPA — redireciona tudo para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
